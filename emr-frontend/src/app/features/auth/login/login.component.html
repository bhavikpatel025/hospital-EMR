<div class="emr-login-page">

  <div class="row g-0 emr-login-split">

    <!-- Left Panel: Illustration -->
    <div class="col-12 col-lg-6 d-none d-lg-flex emr-login-left">
      <div class="emr-login-left__content">
        <!-- <div class="emr-login-brand">
          <div class="emr-login-brand__icon">
            <mat-icon>local_hospital</mat-icon>
          </div>
          <h1 class="emr-login-brand__title">EMR Portal</h1>
        </div>
        <p class="emr-login-brand__tagline">Smart Clinical Records &amp; Patient Management System</p> -->

        <div class="emr-login-illustration-stage">
          <img src="assets/images/Doctor-bro.svg" alt="Doctor Illustration" class="emr-login-illustration" />
        </div>

        <div class="emr-login-trust-strip">
          <div class="emr-trust-item">
            <mat-icon>verified_user</mat-icon>
            <span>HIPAA Compliant</span>
          </div>
          <div class="emr-trust-item">
            <mat-icon>lock</mat-icon>
            <span>Secure Login</span>
          </div>
          <div class="emr-trust-item">
            <mat-icon>support_agent</mat-icon>
            <span>24/7 Support</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel: Login Form -->
    <div class="col-12 col-lg-6 emr-login-right py-5 py-lg-0">
      <div class="emr-login-form-wrapper">

        <div class="emr-login-header text-center text-lg-start">
          <h2 class="emr-login-title fs-2 fs-lg-1">Welcome Back!</h2>
          <p class="emr-login-subtitle fs-6">Please sign in to your account</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="emr-login-form">

          <!-- Email Field -->
          <div class="emr-form-group">
            <label class="emr-form-label">Email Address</label>
            <div class="emr-input-wrapper">
              <mat-icon class="emr-input-icon">mail</mat-icon>
              <input
                type="email"
                class="emr-input w-100 emr-input--with-icon"
                formControlName="email"
                placeholder="e.g. admin@hospital.com"
                [class.is-invalid]="email?.invalid && email?.touched" />
            </div>
            <div class="emr-error" *ngIf="email?.errors?.['required'] && email?.touched">
              Email address is required
            </div>
            <div class="emr-error" *ngIf="email?.errors?.['email'] && email?.touched">
              Please enter a valid email address
            </div>
          </div>

          <!-- Password Field -->
          <div class="emr-form-group">
            <label class="emr-form-label">Password</label>
            <div class="emr-input-wrapper">
              <mat-icon class="emr-input-icon">lock</mat-icon>
              <input
                [type]="showPassword() ? 'text' : 'password'"
                class="emr-input w-100 emr-input--with-icon"
                style="padding-right: 45px;"
                formControlName="password"
                placeholder="Enter your password"
                [class.is-invalid]="password?.invalid && password?.touched" />
              <button type="button" class="emr-password-toggle bg-transparent border-0 d-flex align-items-center position-absolute" style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b;" (click)="togglePassword()">
                <mat-icon style="font-size: 20px; width: 20px; height: 20px;">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </div>
            <div class="emr-error" *ngIf="password?.errors?.['required'] && password?.touched">
              Password is required
            </div>
            <div class="emr-error" *ngIf="password?.errors?.['minlength'] && password?.touched">
              Password must be at least 6 characters
            </div>
          </div>

          <!-- Error Banner -->
          <div class="emr-login-alert" *ngIf="errorMsg()">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMsg() }}</span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="emr-login-btn" [disabled]="loading()">
            <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
            <mat-icon *ngIf="!loading()">login</mat-icon>
            <span>{{ loading() ? 'Signing In...' : 'Sign In' }}</span>
          </button>

        </form>
      </div>
    </div>

  </div>

</div>
