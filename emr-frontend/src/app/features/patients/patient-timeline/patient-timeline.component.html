<div class="emr-patient-timeline p-3">
  <div *ngIf="isLoading" class="text-center p-5 text-muted">
    <i class="pi pi-spin pi-spinner fs-2 mb-2"></i>
    <p>Loading medical history...</p>
  </div>

  <div *ngIf="!isLoading && events.length === 0" class="text-center p-5 text-muted">
    <i class="pi pi-history fs-1 mb-3 text-secondary opacity-50"></i>
    <h5>No Timeline Events</h5>
    <p class="small">There are no recorded appointments, prescriptions, or documents for this patient yet.</p>
  </div>

  <p-accordion [multiple]="true" *ngIf="!isLoading && groupedEvents.length > 0">
    <p-accordionTab *ngFor="let group of groupedEvents; let first = first" [selected]="first">
      <ng-template pTemplate="header">
          <div class="d-flex align-items-center gap-2">
              <i class="pi pi-calendar text-primary"></i>
              <span class="fw-bold">{{ group.date | date:'mediumDate' }}</span>
              <p-badge [value]="group.events.length.toString()" severity="info" styleClass="ms-2"></p-badge>
          </div>
      </ng-template>
      
      <div class="d-flex flex-column gap-3 pt-2">
          <div *ngFor="let event of group.events" class="p-3 border rounded shadow-sm d-flex gap-3 align-items-start bg-white" [style.borderLeft]="'4px solid ' + event.color">
               <div class="rounded-circle d-flex align-items-center justify-content-center text-white" [style.backgroundColor]="event.color" style="width: 40px; height: 40px; min-width: 40px;">
                   <i [class]="event.icon" class="fs-5"></i>
               </div>
               <div class="flex-grow-1">
                   <div class="d-flex justify-content-between align-items-start">
                       <div class="d-flex align-items-center gap-2 mb-1">
                           <h6 class="fw-bold mb-0">{{ event.title }}</h6>
                           <p-button *ngIf="event.additionalInfo" icon="pi pi-info-circle fs-5" [rounded]="true" [text]="true" (onClick)="openInfo(event)" styleClass="p-0 text-primary" [style]="{width: '2.5rem', height: '2.5rem'}" pTooltip="View Details" tooltipPosition="top"></p-button>
                       </div>
                       <small class="text-muted"><i class="pi pi-clock me-1"></i>{{ event.eventDate | date:'shortTime' }}</small>
                   </div>
                   <p class="mb-0 text-secondary small">{{ event.description }}</p>
               </div>
          </div>
      </div>
    </p-accordionTab>
  </p-accordion>

  <!-- Document / Event Info Modal -->
  <p-dialog [header]="selectedEventTitle" [(visible)]="showInfoModal" [modal]="true" [style]="{width: '50vw'}" [breakpoints]="{'960px': '75vw', '640px': '95vw'}">
      <div class="p-3 bg-light rounded-3">
          <p class="mb-0" style="white-space: pre-wrap; line-height: 1.6;">{{ selectedEventInfo }}</p>
      </div>
  </p-dialog>
</div>
