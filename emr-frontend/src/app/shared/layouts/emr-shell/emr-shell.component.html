<div class="emr-shell" [class.sidebar-open-mobile]="sidebarOpenMobile()" [class.sidebar-collapsed]="sidebarCollapsed()">
  <aside class="emr-sidebar">
    <div class="emr-brand d-flex align-items-center gap-3 px-2 py-2 border-bottom mb-2" style="border-color: #f1f5f9 !important;">
      <div class="emr-logo-box d-flex align-items-center justify-content-center text-white shadow-sm" style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #0d9488, #0284c7); font-size: 1.35rem;">
        <i class="pi pi-heart-fill"></i>
      </div>
      <div class="emr-logo-text">
        <strong style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: #0f172a;">EMR</strong>
      </div>
    </div>

    <nav class="emr-nav">
      <a
        *ngFor="let item of primaryNav"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="emr-nav__item"
        (click)="closeSidebar()">
        <div class="qa-icon-box" [ngClass]="item.qaColor || 'qa-blue'" style="width: 32px; height: 32px; font-size: 1rem;">
          <i [class]="item.primeIcon || 'pi pi-check'"></i>
        </div>
        <span class="fw-semibold emr-nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <button type="button" class="emr-help-card mt-auto d-flex align-items-center gap-2 p-2 border-0 bg-transparent text-danger fw-semibold" (click)="logout()" style="cursor: pointer;">
      <div class="qa-icon-box qa-red" style="width: 32px; height: 32px; font-size: 1rem;">
        <i class="pi pi-sign-out"></i>
      </div>
      <span class="emr-nav-label">Sign out</span>
    </button>
  </aside>

  <div class="emr-shell__overlay" (click)="closeSidebar()"></div>

  <div class="emr-main">
    <header class="emr-topbar">
      <div class="emr-topbar__left">
        <button type="button" class="emr-icon-button" (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
        <div>
          <!-- <p class="emr-eyebrow">Hospital operations</p> -->
          <h1>{{ pageTitle() }}</h1>
        </div>
      </div>

        <!-- <div class="emr-topbar__search">
          <i class="pi pi-search me-2" style="color: var(--emr-text-soft, #64748b); font-size: 1.1rem;"></i>
          <input type="text" placeholder="Search patient (name, UHID, mobile)" />
        </div> -->

      <div class="emr-topbar__right d-flex align-items-center gap-3">
        <!-- Notification Bell & Dropdown -->
        <div class="notification-container position-relative">
          <button type="button" class="emr-icon-button position-relative bg-transparent border-0" (click)="toggleNotifications($event)" style="cursor: pointer;" title="Notifications">
            <div class="qa-icon-box bg-light" style="width: 36px; height: 36px; font-size: 1.1rem; border-radius: 8px;">
              <i class="pi pi-bell text-secondary"></i>
            </div>
            <span *ngIf="(unreadCount$ | async) as count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem; padding: 0.35em 0.55em;">
              {{ count > 9 ? '9+' : count }}
            </span>
          </button>

          <!-- Notification Dropdown Panel -->
          <div *ngIf="showNotifications()" class="notification-dropdown">
            <div class="dropdown-header d-flex justify-content-between align-items-center">
              <div class="d-flex align-items-center gap-2">
                <h6 class="mb-0 fw-bold" style="font-size: 0.95rem; color: #0f172a;">Notifications</h6>
                <span *ngIf="(unreadCount$ | async) as unread" class="badge bg-primary rounded-pill" style="font-size: 0.65rem;">
                  {{ unread }} new
                </span>
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-link btn-sm text-decoration-none p-0 text-primary fw-medium" (click)="markAllAsRead($event)" style="font-size: 0.75rem;">Mark all read</button>
                <span class="text-muted" style="font-size: 0.75rem;">•</span>
                <button type="button" class="btn btn-link btn-sm text-decoration-none p-0 text-danger fw-medium" (click)="clearAll($event)" style="font-size: 0.75rem;">Clear all</button>
              </div>
            </div>
            
            <div class="notification-list">
              <ng-container *ngIf="(notifications$ | async) as notifications">
                <div *ngIf="notifications.length === 0" class="p-4 text-center text-muted">
                  <div class="qa-icon-box mx-auto mb-2 bg-light text-muted" style="width: 44px; height: 44px; font-size: 1.3rem; border-radius: 50%;">
                    <i class="pi pi-bell-slash"></i>
                  </div>
                  <p class="mb-0 fw-medium text-secondary" style="font-size: 0.88rem;">No notifications right now</p>
                  <small class="text-muted" style="font-size: 0.75rem;">You're all caught up!</small>
                </div>

                <div *ngFor="let n of notifications" 
                     class="notification-item"
                     [class.unread]="!n.isRead"
                     (click)="markAsRead(n, $event)">
                  
                  <div class="item-icon-box" [ngClass]="!n.isRead ? 'unread' : 'read'">
                    <i class="pi pi-bell"></i>
                  </div>
                  
                  <div class="item-content">
                    <div class="item-header">
                      <h6 class="item-title" [ngClass]="{'text-dark fw-bold': !n.isRead, 'text-secondary': n.isRead}">
                        {{ n.title }}
                      </h6>
                      <span class="item-time">{{ n.createdAt | date:'shortTime' }}</span>
                    </div>
                    <p class="item-message">{{ n.message }}</p>
                  </div>
                  
                  <button type="button" 
                          class="btn-delete-item" 
                          (click)="deleteNotification(n.id, $event)" 
                          title="Delete notification">
                    <i class="pi pi-trash"></i>
                  </button>
                </div>
              </ng-container>
            </div>
          </div>
        </div>

        <div class="emr-date-chip d-flex align-items-center gap-2 px-3 py-1 shadow-2xs">
          <div class="qa-icon-box qa-purple" style="width: 28px; height: 28px; font-size: 0.88rem;"><i class="pi pi-calendar"></i></div>
          <span class="font-semibold text-sm">{{ todayLabel }}</span>
        </div>

        <div class="emr-user d-flex align-items-center gap-2 px-2 py-1 shadow-2xs">
          <div class="qa-icon-box qa-teal d-flex align-items-center justify-content-center" style="width: 36px; height: 36px; font-size: 1.1rem; border-radius: 8px;">
            <i class="pi pi-user"></i>
          </div>
          <div>
            <strong class="d-flex align-items-center gap-1">{{ user?.fullName || 'Dr. Rahul Sharma' }} <i class="pi pi-verified text-primary" style="font-size: 0.78rem;" title="Verified Staff"></i></strong>
            <span>{{ user?.role || 'Rheumatologist' }}</span>
          </div>
        </div>
      </div>
    </header>

    <main class="emr-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
